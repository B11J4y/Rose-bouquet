<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03030a">
<title>For You — ASCII Rose Bouquet</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<canvas id="scene" role="img" aria-label="An animated bouquet of nineteen red and pink roses drawn in text characters, assembling itself under a twinkling night sky. It ends with the words For You."></canvas>
<div id="hud" aria-hidden="true"></div>
<div id="status" aria-hidden="true"></div>
<p id="caption" aria-live="polite"></p>
<div id="controls">
  <button id="pause" type="button" aria-pressed="false">Pause</button>
  <button id="replay" type="button">Replay</button>
</div>
<noscript><p class="ns">This animation needs JavaScript. It ends with the words: FOR YOU &lt;3</p></noscript>
<script src="./script.js"></script>
</body>
</html>
